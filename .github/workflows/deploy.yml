# Deploy — build and publish to the existing Cloudflare Pages project.

name: deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run unit tests
        run: npm test
      - name: Build static site
        run: npm run build
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: "Resolve file deps to npm registry"
        run: |
          sed -i 's|"file:\.\./design-system/packages/oz-ai"|"^0.3.1"|g; s|"file:\.\./design-system/packages/oz-chrome"|"^0.1.0"|g; s|"file:\.\./design-system/packages/oz-file"|"^0.1.0"|g; s|"file:\.\./design-system/packages/oz-tokens-base"|"^0.1.0"|g' package.json
          rm -f package-lock.json

      - run: npm install --legacy-peer-deps

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=oriz-persona --branch=main
